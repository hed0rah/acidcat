name: Publish acidcat-lab

# PARKED ON PURPOSE, and not because anything here is unfinished.
#
# 2026-09-10: `acidcat-lab` is deliberately NOT published to PyPI. The split
# that put it in its own distribution has already done its whole job -- a plain
# `pip install acidcat` no longer ships construction tooling, which is the bug
# it existed to fix. Publishing the lab is a separate question, and the answer
# is no for now.
#
# The reasoning, so nobody re-opens it as a loose end: the lab's audience is
# this repo's own developers and anyone writing detectors, all of whom clone.
# `pip install -e ./lab` already works and CI already does exactly that. A PyPI
# page buys reach we do not want for a dual-use construction tool and costs a
# public statement of intent on a page nobody asked for. The CHANGELOG gives
# the git install for anyone who wants it.
#
# This file is kept, wired and correct rather than deleted, because the day
# that answer changes the machinery should not have to be rewritten. To arm it:
# register `acidcat-lab` on PyPI, add this repo and this workflow filename as a
# trusted publisher, create the `pypi-lab` environment, and point the publish
# step at the real index. It stays `workflow_dispatch` either way -- the lab
# moves on its own schedule, which is the whole reason it is separate.
on:
  workflow_dispatch: {}

jobs:
  # Same reasoning as publish.yml: the gate on an irreversible action is the
  # real test workflow, not a hand-written copy that drifts into being weaker.
  # test.yml installs `-e ./lab`, so the lab's own tests are inside this gate.
  test:
    name: Test before publishing
    uses: ./.github/workflows/test.yml

  build:
    name: Build lab sdist + wheel
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build distributions
        # `lab` is its own project root, so build runs there and dist/ holds
        # only acidcat-lab. Building at the repo root would produce the engine.
        run: |
          python -m pip install --upgrade build
          python -m build lab --outdir dist
      - name: Validate metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*
      - name: Refuse to ship the engine from this workflow
        # A stale build/ directory once put all ten acidcat_lab modules into
        # the engine wheel after they had been moved out of src/. The same
        # class of mistake in this direction ships an `acidcat` distribution
        # from the lab's pipeline, so it is checked rather than assumed.
        run: |
          if ls dist/ | grep -qiE '^acidcat-[0-9]'; then
            echo "dist/ contains an acidcat engine distribution:"
            ls -1 dist/
            exit 1
          fi
          ls -1 dist/
      - uses: actions/upload-artifact@v7
        with:
          name: dist-lab
          path: dist/

  publish-testpypi:
    name: Publish acidcat-lab to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi-lab
      url: https://test.pypi.org/project/acidcat-lab/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist-lab
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
