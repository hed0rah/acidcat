name: Tests

on:
  push:
    # main only. `develop` is retired: squash-merging a LONG-LIVED branch into
    # main guarantees divergence every time, because squash discards the source
    # commits for a new one with a different hash, and the two branches can then
    # only be reconciled by hand. That is not a discipline problem, it recurs
    # after every merge -- and it already cost something real, when develop kept
    # a file main had fixed and a release cut from it would have shipped the old
    # version back.
    #
    # Short-lived branches off main, merged and deleted, have none of that: they
    # are what squash-merge is designed for, and what this repo had already
    # drifted into using.
    branches: [main]
  pull_request:
  # Called by publish.yml, so the gate on an irreversible action is this matrix
  # rather than a thinner copy of it. That copy ran one job on one Python with
  # no ffmpeg, which made the least-covered run in the repo the one deciding
  # what reached PyPI.
  workflow_call:

# A branch that is both pushed and has an open PR matches BOTH triggers, so
# every check ran twice: ten jobs for one commit, around 35 minutes of runner
# time, and two identical rows per platform in the checks list. Grouping on the
# commit rather than the ref means the second trigger supersedes the first
# instead of racing it. Coverage is unchanged: a push with no PR still gets its
# own full run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # pyproject claims 3.10 through 3.13; test the ends and the middle
        # rather than trusting the classifier. 3.9 was claimed until CI proved
        # `pip install acidcat[mcp]` (and therefore [all]) could not resolve on
        # it -- mcp requires >=3.10 -- and 3.9 has been EOL since 2025-10.
        # Windows is here because it is where this tool is developed and used,
        # and because its path/pipe/encoding differences are real rather than
        # theoretical: a closed-pipe bug and a hardcoded /tmp in a test have
        # each already cost a fix.
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install bubblewrap
        # exercises the --sandbox bwrap profile for real. Ubuntu 24.04 blocks
        # unprivileged user namespaces via AppArmor, so relax that sysctl for
        # the runner; the sandbox tests skip gracefully if it still cannot run.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Install ffmpeg
        # Not a runtime dependency -- acidcat bundles no decoders. It builds the
        # specimens for the deep-checksum and concealment tests: a real FLAC to
        # verify frame CRCs against, a real 24-bit WAV for the not-applicable
        # path. Those tests guard `validate --deep`, a headline of 1.0.
        #
        # Without it they SKIP, and a skipped test is a green run that checked
        # nothing -- the same failure as the `ml`/`tui` extras below, which
        # silently skipped whole suites while every run reported success. The
        # conftest guard makes absence graceful for a contributor's laptop; it
        # is not a licence for CI to stop checking.
        #
        # Retried, because the package feeds go down and a release should not
        # be blocked by someone else's outage: the Windows job failed once on a
        # Chocolatey 503. Three attempts with backoff, then fail loudly rather
        # than continuing without it -- letting the job pass with ffmpeg absent
        # would put the deep-checksum tests back to skipping in silence, which
        # is the state this step exists to end.
        shell: bash
        run: |
          # Nothing to do if the image already ships it. Free to check, and it
          # skips the package feeds entirely on runners that have it.
          if command -v ffmpeg >/dev/null 2>&1; then
            echo "ffmpeg already present: $(ffmpeg -version | head -1)"
            exit 0
          fi

          # Windows fallback, because Chocolatey's community feed rate-limits
          # CI address ranges and reports it as "the package was not found with
          # the source(s) listed" rather than as a rate limit. That is
          # indistinguishable from a delisted package, so the retry loop below
          # cannot tell a real outage from a throttle and burns all three
          # attempts on something that will not recover. A static build from a
          # GitHub release avoids the feed and the host is the one already
          # serving this job.
          install_from_github() {
            local url tmp
            url="https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
            tmp="$RUNNER_TEMP/ffmpeg.zip"
            curl -fsSL --retry 3 -o "$tmp" "$url" || return 1
            powershell -Command "Expand-Archive -Path '$tmp' -DestinationPath '$RUNNER_TEMP/ffmpeg' -Force" || return 1
            local bin
            bin="$(find "$RUNNER_TEMP/ffmpeg" -name ffmpeg.exe -print -quit)"
            [ -n "$bin" ] || return 1
            echo "$(dirname "$bin")" >> "$GITHUB_PATH"
            export PATH="$(dirname "$bin"):$PATH"
          }

          install_ffmpeg() {
            if [ "$RUNNER_OS" = "Linux" ]; then
              sudo apt-get update && sudo apt-get install -y ffmpeg
            elif [ "$RUNNER_OS" = "macOS" ]; then
              brew install ffmpeg
            else
              choco install ffmpeg -y --no-progress || install_from_github
            fi
          }
          for attempt in 1 2 3; do
            if install_ffmpeg && command -v ffmpeg >/dev/null 2>&1; then
              break
            fi
            echo "ffmpeg install attempt $attempt failed; retrying in $((attempt * 20))s"
            sleep $((attempt * 20))
          done
          command -v ffmpeg >/dev/null 2>&1 || {
            echo "::error::ffmpeg could not be installed after 3 attempts. The"
            echo "::error::deep-checksum and concealment tests would SKIP, so this"
            echo "::error::job fails rather than reporting a green run that"
            echo "::error::verified none of validate --deep."
            exit 1
          }
          ffmpeg -version | head -1
      - name: Install
        # `ml` was requested here and is not a defined extra -- pip warns and
        # carries on, so it looked installed and never was. `tui` and `crypto`
        # were simply missing, which silently skipped the whole Textual suite
        # and the encrypted-disc tests on every run.
        # `acidcat_lab` used to ride along in the engine's wheel, so the five
        # lab test files ran without anyone installing anything. It is a
        # separate distribution now: drop `-e ./lab` and they do not fail, they
        # stop being collected, which reads as a smaller green suite.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[analysis,mcp,tui,crypto]" -e ./lab pytest pytest-cov
      - name: Run tests
        # -rs prints WHY things skipped. Without it the run reported "114
        # skipped" and gave nobody a way to find out what was not covered.
        run: pytest -q -rs --cov=acidcat --cov-report=term-missing:skip-covered
