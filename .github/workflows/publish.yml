on:
  release:
    types: [published]
  workflow_dispatch: {}

jobs:
  # Publishing is irreversible: a version number can never be reused on PyPI.
  # The build job used to run alone, so `twine check` passing was the only thing
  # between a tag and the index -- a release could ship a tree whose tests fail.
  #
  # That gate was then a hand-written copy of the test workflow, and it had
  # drifted into being weaker than the thing it stood in for: ONE job, on
  # ubuntu, on a Python version the matrix does not test, with neither ffmpeg
  # nor bubblewrap installed. So the least-covered run in the repo was the one
  # deciding what reached PyPI, and it verified 113 fewer tests than an ordinary
  # PR did. Calling the real workflow means the gate cannot drift again: there
  # is only one definition of "the tests pass".
  test:
    name: Test before publishing
    uses: ./.github/workflows/test.yml

  build:
    name: Build sdist + wheel
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build distributions
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Validate metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*
      # a release tag that disagrees with the version would publish the wrong
      # number, and a number can never be reused
      - name: Tag matches version
        if: github.event_name == 'release'
        run: |
          want="${GITHUB_REF_NAME#v}"
          have="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          echo "tag $want, pyproject $have"
          test "$want" = "$have"
      # the tests ran on the source tree; this runs the artifact that ships, so
      # a module or data file left out of the wheel stops the release here
      - name: Smoke-test the built wheel
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/acidcat --version
          /tmp/smoke/bin/acidcat inspect data/fixtures/tone.wav
          /tmp/smoke/bin/acidcat formats > /dev/null
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish-testpypi:
    name: Publish to TestPyPI (manual dry-run)
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/acidcat/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI (on release)
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/acidcat/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/    
      - uses: pypa/gh-action-pypi-publish@release/v1
